<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Tax Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />


  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 2rem; }
    form { display: grid; gap: 0.75rem; max-width: 320px; }
    input[type="number"] { padding: 0.5rem; font-size: 1rem; }
    button { padding: 0.6rem 0.9rem; font-size: 1rem; cursor: pointer; }
    .result { margin-top: 1rem; font-weight: 600; }
    .error { margin-top: 1rem; }
  </style>


  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
  <h1>Tax Calculator</h1>

  <form id="tax-form">
    <label>
      Employment income
      <input type="number" id="input-empl" step="any" required />
    </label>

    <label>
      Savings income
      <input type="number" id="input-savings" step="any" required />
    </label>

    <label>
      Bonus income
      <input type="number" id="input-bonus" step="any" required />
    </label>


    <button type="button" onclick="calculate()">Preview</button>

  </form>

  <div id="feedbackempl"></div>
  <div id="feedbacksavings"></div>
  <div id="feedbackbonus"></div>


   <script>
    let feedback1 = document.getElementById("feedbackempl");
    let feedback2= document.getElementById("feedbacksavings");
    let feedback3 = document.getElementById("feedbackbonus");


  

    function calculate() {
  const a = document.getElementById('input-empl').value;     // employment
  const b = document.getElementById('input-savings').value;  // savings
  const c = document.getElementById('input-bonus').value;    // bonus

  feedback1.textContent = feedback2.textContent = feedback3.textContent = "";
  feedback1.className = feedback2.className = feedback3.className = "";

  
  axios.post("/api/calcTax", { a, b, c })
    .then(res => {
      feedback1.className = feedback2.className = feedback3.className = "result";

     

      feedback1.textContent = `Tax on employment: £${res.data.taxOnEmployment.value}`;
      feedback2.textContent = `Tax on savings: £${res.data.taxOnSavings.value}`;
      feedback3.textContent = `Tax on bonus: £${res.data.taxOnBonus.value}`;

;
    })
    .catch(err => displayError(err));
}




    function save() {
  const a = document.getElementById('input-empl').value;
  const b = document.getElementById('input-savings').value;
  const c = document.getElementById('input-bonus').value;

  feedback1.textContent = feedback2.textContent = feedback3.textContent = "";
  feedback1.className = feedback2.className = feedback3.className = "";

  axios.post("/api/saveTax", { a, b, c })
    .then(res => {
      feedback1.className = "result";
      feedback1.textContent = "Saved successfully";
    })
    .catch(err => displayError(err));
}



    function displayError(err) {
  feedback1.className = feedback2.className = feedback3.className = "error";

  const d = err?.response?.data || {};

  if (d.error1) {
    feedback1.textContent = "Please provide your income";
  } else if (d.error2) {
    feedback1.textContent = "Please provide positive income";
  } else if (d.error4) {
    feedback1.textContent = "Both incomes must be numerical";
  } else if (d.error) {
    feedback1.textContent = "Error saving data";
  } else {
    feedback1.textContent = "Something went wrong";
  }
}



  </script>
</body>
</html>
